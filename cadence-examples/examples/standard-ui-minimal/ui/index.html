<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reference document workspace</title>
<link rel="stylesheet" href="styles.css">
<body>
<header><h1>Reference document workspace</h1><p>Local synthetic sample. Saves do not grant task completion or qualification.</p></header>
<main>
  <nav aria-label="Documents"><button data-document="A">Document A</button><button data-document="B">Document B</button></nav>
  <section aria-labelledby="document-title">
    <h2 id="document-title">Choose a document</h2>
    <p id="status" role="status" aria-live="polite">Ready</p>
    <label for="editor">Document text</label><textarea id="editor" rows="12" disabled></textarea>
    <p id="dirty">No unsaved edits</p>
    <div class="actions"><button id="save" disabled>Save</button><button id="cancel" disabled>Stop request</button><button id="reconcile" disabled>Check original save</button><button id="history" disabled>View history</button></div>
    <section aria-label="Full document reading"><h3>Full document</h3><pre id="reading" tabindex="0"></pre></section>
    <section aria-label="History"><h3>History</h3><p id="history-status">Not loaded</p><ul id="history-list"></ul><pre id="history-detail" tabindex="0"></pre></section>
  </section>
</main>
<dialog id="discard-dialog" aria-labelledby="discard-title">
  <h2 id="discard-title">Leave unsaved edits?</h2><p>Your current edits will be discarded.</p>
  <button id="keep-editing" autofocus>Keep editing</button><button id="discard">Discard and continue</button>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
