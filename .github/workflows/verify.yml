name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cadence-oss-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: "1.26.9"
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Install Python verification tools
        run: python -m pip install --disable-pip-version-check -r requirements-verify.txt
      - name: Verify every public release unit
        run: bash ./scripts/verify --full
      - name: Audit Python dependencies and source
        run: |
          pip-audit --progress-spinner off --strict -r requirements-verify.txt
          bandit -q -lll -r cadence-protocol cadence-plugins cadence-registry cadence-sandbox contracts-hub-template cadence-examples
      - name: Audit every Go module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' module; do
            (
              cd "$(dirname "$module")"
              govulncheck -show verbose ./...
            )
          done < <(find . -name go.mod -print0 | sort -z)
      - name: Audit every Node lock when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' locks < <(find . -name package-lock.json -print0 | sort -z)
          if ((${#locks[@]} == 0)); then
            echo "No Node lockfiles are included in this release line."
            exit 0
          fi
          for lock in "${locks[@]}"; do
            npm --prefix "$(dirname "$lock")" audit --omit=dev --audit-level=high
          done
