name: release-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.25.12'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: python3 -m pip install --disable-pip-version-check -r requirements-verify.txt pip-audit==2.10.1 bandit==1.9.4
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: bash ./scripts/verify
      - run: bash ./scripts/verify --full
      - run: govulncheck -show verbose ./...
        working-directory: cadence-core
      - run: pip-audit --progress-spinner off -r requirements-verify.txt
      - run: bandit -q -lll -r cadence-protocol cadence-plugins cadence-registry cadence-sandbox contracts-hub-template cadence-examples
      - name: Verify extracted source archive
        run: |
          git archive --format=tar --prefix=cadence-oss-v1.1.0/ HEAD | gzip -n > cadence-oss-v1.1.0.tar.gz
          mkdir extracted
          tar -xzf cadence-oss-v1.1.0.tar.gz -C extracted
          bash extracted/cadence-oss-v1.1.0/scripts/verify --full
      - name: Verify deterministic source archive
        run: |
          git archive --format=tar --prefix=cadence-oss-v1.1.0/ HEAD | gzip -n > source-a.tar.gz
          git archive --format=tar --prefix=cadence-oss-v1.1.0/ HEAD | gzip -n > source-b.tar.gz
          sha256sum source-a.tar.gz source-b.tar.gz
          cmp source-a.tar.gz source-b.tar.gz
