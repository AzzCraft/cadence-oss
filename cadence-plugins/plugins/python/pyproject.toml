[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-plugin-python"
version = "1.0.0"
description = "Cadence Python boundary analyzer"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
cadence-plugin-python = "cadence_plugin_python.__main__:main"
